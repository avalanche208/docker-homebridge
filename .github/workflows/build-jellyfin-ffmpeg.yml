name: Build Homebridge with Jellyfin FFmpeg

on:
  workflow_dispatch:
  push:
    branches:
      - latest
    paths:
      - Dockerfile.jellyfin
      - .github/workflows/build-jellyfin-ffmpeg.yml
  schedule:
    - cron: "17 8 * * 0"

permissions:
  contents: write
  packages: write

concurrency:
  group: homebridge-jellyfin-ffmpeg
  cancel-in-progress: false

env:
  JELLYFIN_FFMPEG_VERSION: 7.1.4-3
  GHCR_IMAGE: ghcr.io/avalanche208/homebridge-jellyfin-ffmpeg
  DOCKERHUB_IMAGE: avalanche208/homebridge-jellyfin-ffmpeg

jobs:
  sync-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set release metadata
        id: release
        run: echo "tag=$(date -u +%Y-%m-%d)-jellyfin-${JELLYFIN_FFMPEG_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Sync official package metadata
        run: |
          curl --fail --location --show-error             https://raw.githubusercontent.com/homebridge/docker-homebridge/latest/package.json             --output package.json.upstream
          if ! cmp --silent package.json package.json.upstream; then
            mv package.json.upstream package.json
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package.json
            git commit -m "Sync package metadata from official Homebridge"
            git push origin HEAD:latest
          else
            rm package.json.upstream
          fi

      - name: Verify official Homebridge image
        run: docker buildx imagetools inspect homebridge/homebridge:latest

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push GHCR image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.jellyfin
          platforms: linux/amd64,linux/arm64
          push: true
          pull: true
          build-args: |
            JELLYFIN_FFMPEG_VERSION=${{ env.JELLYFIN_FFMPEG_VERSION }}
          tags: |
            ${{ env.GHCR_IMAGE }}:latest
            ${{ env.GHCR_IMAGE }}:jellyfin-${{ env.JELLYFIN_FFMPEG_VERSION }}
            ${{ env.GHCR_IMAGE }}:${{ steps.release.outputs.tag }}

      - name: Check Docker Hub credentials
        id: dockerhub
        env:
          USERNAME: ${{ secrets.DOCKER_USERNAME }}
          TOKEN: ${{ secrets.DOCKER_PASSWORD }}
        run: |
          if [ -n "$USERNAME" ] && [ -n "$TOKEN" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Docker Hub publishing skipped. Add DOCKER_USERNAME and DOCKER_PASSWORD repository secrets to enable it."
          fi

      - name: Log in to Docker Hub
        if: steps.dockerhub.outputs.enabled == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker Hub image
        if: steps.dockerhub.outputs.enabled == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.jellyfin
          platforms: linux/amd64,linux/arm64
          push: true
          pull: true
          build-args: |
            JELLYFIN_FFMPEG_VERSION=${{ env.JELLYFIN_FFMPEG_VERSION }}
          tags: |
            ${{ env.DOCKERHUB_IMAGE }}:latest
            ${{ env.DOCKERHUB_IMAGE }}:jellyfin-${{ env.JELLYFIN_FFMPEG_VERSION }}
            ${{ env.DOCKERHUB_IMAGE }}:${{ steps.release.outputs.tag }}

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          NOTES=$(cat <<EOF
          Homebridge with Jellyfin FFmpeg ${JELLYFIN_FFMPEG_VERSION}

          Images:
          - docker.io/${DOCKERHUB_IMAGE}:${RELEASE_TAG}
          - ghcr.io/avalanche208/homebridge-jellyfin-ffmpeg:${RELEASE_TAG}

          Built from the current official homebridge/homebridge:latest image for linux/amd64 and linux/arm64.
          EOF
          )
          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            gh release edit "${RELEASE_TAG}" --title "Homebridge Jellyfin FFmpeg ${RELEASE_TAG}" --notes "${NOTES}"
          else
            gh release create "${RELEASE_TAG}" --title "Homebridge Jellyfin FFmpeg ${RELEASE_TAG}" --notes "${NOTES}" --latest
          fi
