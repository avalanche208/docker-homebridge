name: Build Homebridge with Jellyfin FFmpeg

on:
  workflow_dispatch:
  push:
    branches:
      - latest
    paths:
      - Dockerfile.jellyfin
      - .github/workflows/build-jellyfin-ffmpeg.yml
  schedule:
    - cron: "17 8 * * 0"

permissions:
  contents: write
  packages: write

concurrency:
  group: homebridge-jellyfin-ffmpeg
  cancel-in-progress: false

env:
  JELLYFIN_FFMPEG_VERSION: 7.1.4-3
  GHCR_IMAGE: ghcr.io/avalanche208/homebridge-jellyfin-ffmpeg
  DOCKERHUB_IMAGE: avalanche208/homebridge-jellyfin-ffmpeg

jobs:
  sync-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync official Homebridge repository
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/homebridge/docker-homebridge.git
          git fetch upstream latest
          git merge --no-edit upstream/latest
          git push origin HEAD:latest

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push GHCR image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.jellyfin
          platforms: linux/amd64,linux/arm64
          push: true
          pull: true
          build-args: |
            JELLYFIN_FFMPEG_VERSION=${{ env.JELLYFIN_FFMPEG_VERSION }}
          tags: |
            ${{ env.GHCR_IMAGE }}:latest
            ${{ env.GHCR_IMAGE }}:jellyfin-${{ env.JELLYFIN_FFMPEG_VERSION }}

      - name: Check Docker Hub credentials
        id: dockerhub
        env:
          USERNAME: ${{ secrets.DOCKER_USERNAME }}
          TOKEN: ${{ secrets.DOCKER_PASSWORD }}
        run: |
          if [ -n "$USERNAME" ] && [ -n "$TOKEN" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Docker Hub publishing skipped. Add DOCKER_USERNAME and DOCKER_PASSWORD repository secrets to enable it."
          fi

      - name: Log in to Docker Hub
        if: steps.dockerhub.outputs.enabled == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker Hub image
        if: steps.dockerhub.outputs.enabled == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.jellyfin
          platforms: linux/amd64,linux/arm64
          push: true
          pull: true
          build-args: |
            JELLYFIN_FFMPEG_VERSION=${{ env.JELLYFIN_FFMPEG_VERSION }}
          tags: |
            ${{ env.DOCKERHUB_IMAGE }}:latest
            ${{ env.DOCKERHUB_IMAGE }}:jellyfin-${{ env.JELLYFIN_FFMPEG_VERSION }}
